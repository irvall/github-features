name: Close Issues on Release Merge

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Find and close labeled issues
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ready for testing';
            const releaseVersion = context.payload.pull_request.head.ref;
            
            // Find all open issues with the label
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            
            console.log(`Found ${issues.length} issues to close`);
            
            // Close each issue
            for (const issue of issues) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Closed automatically as ${releaseVersion} was merged into develop.`
                });
                
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label
                });
                
                console.log(`Closed issue #${issue.number}`);
              } catch (error) {
                console.error(`Failed to close issue #${issue.number}:`, error.message);
              }
            }