name: Label Issues on Release Merge

on:
  pull_request:
    types: [closed]
    branches:
      - 'release/**'

jobs:
  label-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Get linked issues
        id: get-issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            
            // Match common issue references: #123, fixes #123, closes #123, etc.
            const issueRegex = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const simpleRegex = /#(\d+)/g;
            
            const issues = new Set();
            
            // Extract from keywords
            let match;
            while ((match = issueRegex.exec(body)) !== null) {
              issues.add(match[3]);
            }
            
            // Also check the PR title for issue references
            const titleMatches = pr.title.match(simpleRegex);
            if (titleMatches) {
              titleMatches.forEach(m => issues.add(m.replace('#', '')));
            }
            
            return Array.from(issues);
          result-encoding: json
      
      - name: Add label to issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = ${{ steps.get-issues.outputs.result }};
            const label = 'ready-for-testing';
            
            for (const issueNumber of issues) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNumber),
                  labels: [label]
                });
                console.log(`Added "${label}" label to issue #${issueNumber}`);
              } catch (error) {
                console.error(`Failed to label issue #${issueNumber}:`, error.message);
              }
            }